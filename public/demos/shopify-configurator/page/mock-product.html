<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ステンレスタンブラー ── みなと工房 オンラインストア（見本）</title>
  <!-- Shopify を使わずに動きを見るための見本の商品ページです。3D コンフィギュレーターの部分は、section が書き出すものと同じです -->
  <link rel="stylesheet" href="../theme/assets/product-configurator.css">
  <link rel="stylesheet" href="../theme/assets/suminawa-configurator.css">
  <style>
    :root {
      color-scheme: light;
      --page-bg: #faf8f3;
      --page-fg: #1c1a15;
      --page-muted: #6a665d;
      --page-line: rgba(28, 26, 21, 0.14);
      --page-accent: #243a5e;
      --color-button: 36, 58, 94;
      --color-button-text: 255, 255, 255;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; color: var(--page-fg); background: var(--page-bg); }
    .page-width { max-width: 78rem; margin: 0 auto; padding: 0 1rem; }
    .mock-banner { margin: 0; padding: 0.5rem 1rem; font-size: 0.8125rem; text-align: center; color: #fff; background: var(--page-accent); }
    .mock-header { border-bottom: 1px solid var(--page-line); background: #fff; }
    .mock-header .page-width { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: center; justify-content: space-between; min-height: 4rem; }
    .mock-store { margin: 0; font-size: 1.0625rem; font-weight: 700; letter-spacing: 0.04em; }
    .mock-lang { display: flex; gap: 0.75rem; font-size: 0.875rem; }
    .mock-lang a { color: var(--page-muted); }
    .mock-lang a[aria-current="true"] { color: var(--page-fg); font-weight: 600; text-decoration: none; }
    .mock-product { padding-block: 2rem 1rem; }
    .mock-crumbs { margin: 0 0 0.5rem; font-size: 0.8125rem; color: var(--page-muted); }
    .mock-product h1 { margin: 0 0 0.5rem; font-size: clamp(1.375rem, 3vw, 1.875rem); line-height: 1.3; }
    .mock-lede { max-width: 44rem; margin: 0; color: var(--page-muted); }
    .mock-cart { margin-block: 1rem 3rem; padding: 1rem 1.25rem; border: 1px dashed var(--page-line); border-radius: 0.75rem; background: #fff; }
    .mock-cart h2 { margin: 0 0 0.25rem; font-size: 1rem; }
    .mock-cart h3 { margin: 1.25rem 0 0.25rem; font-size: 0.875rem; }
    .mock-cart p { margin: 0 0 0.75rem; font-size: 0.8125rem; color: var(--page-muted); }
    .mock-cart dl { display: grid; grid-template-columns: minmax(7rem, max-content) minmax(0, 1fr); gap: 0.25rem 1rem; margin: 0; font-size: 0.875rem; }
    .mock-cart dt { color: var(--page-muted); }
    .mock-cart dd { margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 40rem) { .mock-cart dl { grid-template-columns: minmax(0, 1fr); } .mock-cart dd { margin-bottom: 0.5rem; } }
  </style>
</head>
<body>
  <p class="mock-banner" data-ja="これは見本の商品ページです。カートは本物ではなく、カートに届く内容をページの下に表示します。" data-en="This is a sample product page. The cart is not real: what would be sent to the cart is shown below.">これは見本の商品ページです。カートは本物ではなく、カートに届く内容をページの下に表示します。</p>
  <header class="mock-header">
    <div class="page-width">

      <nav class="mock-lang" aria-label="Language">
        <a href="?lang=ja" data-lang-link="ja">日本語</a>

      </nav>
    </div>
  </header>

    <!-- ここまで -->

    <section class="mock-cart page-width" aria-live="polite">
      <h2 data-ja="カートに届いた内容（見本）" data-en="What the cart received (sample)">カートに届いた内容（見本）</h2>
      <p data-ja="カートとチェックアウトには、次のように出ます。" data-en="The cart and checkout show it like this.">カートとチェックアウトには、次のように出ます。</p>

      <h3 data-ja="管理画面の注文詳細にだけ残る行" data-en="Lines kept only in the order details in the admin">管理画面の注文詳細にだけ残る行</h3>
      <p data-ja="_ で始まる行は、カートとチェックアウトには出ません。店の人が、作るときに見るためのものです。" data-en="Lines starting with _ are not shown in the cart or checkout. They are for the store staff to read when making the item.">_ で始まる行は、カートとチェックアウトには出ません。店の人が、作るときに見るためのものです。</p>

  <script>
    // 見本だけの下ごしらえ: 言語を ?lang= で選び、/cart/add.js を偽物で受けて、届いた内容を下に出す
    (function () {
      var lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ja";
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-ja]").forEach(function (node) {
        node.textContent = node.getAttribute("data-" + lang);
      });
      document.querySelectorAll("[data-lang-link]").forEach(function (link) {
        link.setAttribute("aria-current", String(link.getAttribute("data-lang-link") === lang));
      });
      document.title = lang === "en" ? "Stainless tumbler — Minato Kobo Online Store (sample)" : document.title;

      var contextNode = document.querySelector("[data-sc-context]");
      var context = JSON.parse(contextNode.textContent);
      context.lang = lang;
      contextNode.textContent = JSON.stringify(context);

      var list = document.getElementById("mock-cart-list");
      var hidden = document.getElementById("mock-cart-hidden");
      function row(target, key, value) {
        var dt = document.createElement("dt");
        var dd = document.createElement("dd");
        dt.textContent = key;
        dd.textContent = value;
        target.append(dt, dd);
      }
      var realFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        var url = typeof input === "string" ? input : input.url;
        if (!/\/cart\/add\.js$/.test(url)) return realFetch(input, init);
        var item = JSON.parse(init.body).items[0];
        list.replaceChildren();
        hidden.replaceChildren();
        // カートの行と同じ並び: 商品名、バリエーション（オプション名: 値）、選んだ内容の行、数量
        var variant = context.product.variants.find(function (v) { return v.id === item.id; });
        row(list, lang === "en" ? "Product" : "商品", context.product.title);
        context.product.options.forEach(function (name, i) {
          if (variant) row(list, name, variant.options[i]);
        });
        Object.keys(item.properties).forEach(function (key) {
          row(key.charAt(0) === "_" ? hidden : list, key, item.properties[key]);
        });
        row(list, lang === "en" ? "Quantity" : "数量", String(item.quantity));
        return Promise.resolve(new Response(JSON.stringify({ items: [item] }), { status: 200, headers: { "Content-Type": "application/json" } }));
      };
      // 本物のストアでは /cart へ移る。見本ではページに残って、届いた内容を見せる
      document.addEventListener("suminawa-configurator:added", function (event) {
        event.preventDefault();
        list.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    })();
  </script>
  <script src="../theme/assets/product-configurator.global.js" defer></script>
  <script src="../theme/assets/suminawa-configurator.js" defer></script>

</html>
